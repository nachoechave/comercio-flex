<span id="solucion" class="anchor" aria-hidden="true"></span>
<section class="section" aria-labelledby="features-title">
  <div class="section__heading">
    <p class="eyebrow">Una solución conectada</p>
    <h2 id="features-title">Todo lo que necesitás para vender y gestionar</h2>
    <p>
      Una experiencia unificada para tu catálogo, la operación diaria y la compra de tus clientes.
    </p>
  </div>

  <div class="feature-grid">
    @for (feature of features; track feature.title) {
      <article class="feature-card">
        <span class="feature-card__marker" aria-hidden="true">{{ feature.marker }}</span>
        <h3>{{ feature.title }}</h3>
        <p>{{ feature.description }}</p>
      </article>
    }
  </div>
</section>
