spring:
  flyway:
    user: ${MIGRATION_DB_USER:comercio_flex_migration}
    password: ${MIGRATION_DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: false

app:
  local-owner:
    enabled: ${LOCAL_OWNER_ENABLED:false}
    email: ${LOCAL_OWNER_EMAIL:}
    password: ${LOCAL_OWNER_PASSWORD:}
    display-name: ${LOCAL_OWNER_DISPLAY_NAME:}
    store-slug: ${LOCAL_OWNER_STORE_SLUG:}
  database:
    tenant-migration-enabled: true
    tenant-connections:
      tenant-a:
        url: ${TENANT_A_DB_URL:jdbc:mysql://localhost:3306/comercio_flex_tenant_a}
        username: ${TENANT_A_DB_USER:comercio_flex_app}
        password: ${TENANT_A_DB_PASSWORD}
      tenant-b:
        url: ${TENANT_B_DB_URL:jdbc:mysql://localhost:3306/comercio_flex_tenant_b}
        username: ${TENANT_B_DB_USER:comercio_flex_app}
        password: ${TENANT_B_DB_PASSWORD}
