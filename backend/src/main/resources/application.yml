spring:
  application:
    name: comercio-flex-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${CONTROL_DB_URL:jdbc:mysql://localhost:3306/comercio_flex_control}
    username: ${CONTROL_DB_USER:comercio_flex_app}
    password: ${CONTROL_DB_PASSWORD}
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  flyway:
    locations: classpath:db/migration/control
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:6MB}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: CFSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level requestId=%X{requestId:-none} logger=%logger{36} - %msg%n"

app:
  super-admin-bootstrap:
    enabled: ${SUPER_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${SUPER_ADMIN_BOOTSTRAP_EMAIL:}
    password: ${SUPER_ADMIN_BOOTSTRAP_PASSWORD:}
    display-name: ${SUPER_ADMIN_BOOTSTRAP_DISPLAY_NAME:}
  media:
    storage: ${MEDIA_STORAGE:local}
    local-root: ${MEDIA_LOCAL_ROOT:.data/media}
    max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
    max-pixels: ${MEDIA_MAX_PIXELS:10000000}
    display-max-dimension: ${MEDIA_DISPLAY_MAX_DIMENSION:1600}
    thumbnail-max-dimension: ${MEDIA_THUMBNAIL_MAX_DIMENSION:480}
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      region: ${MEDIA_S3_REGION:us-east-1}
      endpoint: ${MEDIA_S3_ENDPOINT:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      path-style: ${MEDIA_S3_PATH_STYLE:false}
  cors:
    allowed-origin: ${FRONTEND_ORIGINS:${FRONTEND_ORIGIN:http://localhost:4200}}
  payments:
    mercado-pago:
      enabled: ${PAYMENTS_MERCADO_PAGO_ENABLED:false}
      environment: ${PAYMENT_MODE:TEST}
      client-id: ${MP_CLIENT_ID:}
      client-secret: ${MP_CLIENT_SECRET:}
      redirect-uri: ${MP_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/mercado-pago/oauth/callback}
      frontend-base-uri: ${PUBLIC_FRONTEND_BASE_URI:${FRONTEND_ORIGIN:http://localhost:4200}}
      active-key-id: ${PAYMENT_TOKEN_ACTIVE_KEY_ID:v1}
      encryption-key: ${PAYMENT_TOKEN_ENCRYPTION_KEY_V1:}
      connect-timeout: ${MP_CONNECT_TIMEOUT:3s}
      read-timeout: ${MP_READ_TIMEOUT:8s}
    checkout-pro:
      enabled: ${PAYMENTS_CHECKOUT_PRO_ENABLED:false}
      test-access-token: ${MP_TEST_ACCESS_TOKEN:}
      test-seller-account-id: ${MP_TEST_SELLER_ACCOUNT_ID:}
      test-demo-tenant-slug: ${MP_TEST_DEMO_TENANT_SLUG:}
      public-backend-base-uri: ${PUBLIC_BACKEND_BASE_URI:http://localhost:8080}
      frontend-base-uri: ${PUBLIC_FRONTEND_BASE_URI:${FRONTEND_ORIGIN:http://localhost:4200}}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      connect-timeout: ${MP_CONNECT_TIMEOUT:3s}
      read-timeout: ${MP_READ_TIMEOUT:8s}
      webhook-lease: ${PAYMENT_WEBHOOK_LEASE:30s}
      retry-delay: ${PAYMENT_WEBHOOK_RETRY_DELAY:30s}
      max-webhook-attempts: ${PAYMENT_WEBHOOK_MAX_ATTEMPTS:8}
      return-token-ttl: ${PAYMENT_RETURN_TOKEN_TTL:24h}
  database:
    tenant-migration-enabled: ${TENANT_MIGRATION_ENABLED:false}
    migration-username: ${MIGRATION_DB_USER:}
    migration-password: ${MIGRATION_DB_PASSWORD:}
    managed:
      provisioning-enabled: ${TENANT_PROVISIONING_ENABLED:false}
      url-template: '${TENANT_DB_URL_TEMPLATE:}'
      application-username: ${TENANT_SHARED_DB_USER:}
      application-password: ${TENANT_SHARED_DB_PASSWORD:}
      provisioning-url: ${TENANT_PROVISIONING_DB_URL:}
      provisioning-username: ${TENANT_PROVISIONING_DB_USER:}
      provisioning-password: ${TENANT_PROVISIONING_DB_PASSWORD:}
      database-prefix: ${TENANT_DATABASE_PREFIX:comercio_flex_tenant_}
      database-user-host: ${TENANT_DATABASE_USER_HOST:%}
    tenant-connections:
      tenant-a:
        url: ${TENANT_A_DB_URL:}
        username: ${TENANT_A_DB_USER:}
        password: ${TENANT_A_DB_PASSWORD:}
      tenant-b:
        url: ${TENANT_B_DB_URL:}
        username: ${TENANT_B_DB_USER:}
        password: ${TENANT_B_DB_PASSWORD:}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      max-keys: ${LOGIN_RATE_LIMIT_MAX_KEYS:10000}
