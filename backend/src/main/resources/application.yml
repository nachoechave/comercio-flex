spring:
  application:
    name: comercio-flex-backend
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${CONTROL_DB_URL:jdbc:mysql://localhost:3306/comercio_flex_control}
    username: ${CONTROL_DB_USER:comercio_flex_app}
    password: ${CONTROL_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration/control
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  session:
    store-type: jdbc
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        name: CFSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  payments:
    mercado-pago:
      enabled: ${PAYMENTS_MERCADO_PAGO_ENABLED:false}
      environment: ${PAYMENT_MODE:TEST}
      client-id: ${MP_CLIENT_ID:}
      client-secret: ${MP_CLIENT_SECRET:}
      redirect-uri: ${MP_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/mercado-pago/oauth/callback}
      frontend-base-uri: ${FRONTEND_ORIGIN:http://localhost:4200}
      active-key-id: ${PAYMENT_TOKEN_ACTIVE_KEY_ID:v1}
      encryption-key: ${PAYMENT_TOKEN_ENCRYPTION_KEY_V1:}
      connect-timeout: ${MP_CONNECT_TIMEOUT:3s}
      read-timeout: ${MP_READ_TIMEOUT:8s}
  database:
    tenant-migration-enabled: ${TENANT_MIGRATION_ENABLED:false}
    migration-username: ${MIGRATION_DB_USER:}
    migration-password: ${MIGRATION_DB_PASSWORD:}
    tenant-connections: {}
  security:
    login-rate-limit:
      max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${LOGIN_RATE_LIMIT_WINDOW:15m}
      max-keys: ${LOGIN_RATE_LIMIT_MAX_KEYS:10000}
