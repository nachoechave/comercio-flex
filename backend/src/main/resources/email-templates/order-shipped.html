<html lang="es"><head><meta charset="utf-8"><title>Pedido despachado</title></head>
<body style="font-family:Arial,sans-serif;color:#172033;background:#f5f6fa;padding:24px">
<main style="max-width:600px;margin:auto;background:white;padding:24px">
